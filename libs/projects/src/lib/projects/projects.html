<div class="projects-page">
  @for (section of sections; track section.category) {
    @if (getProjects(section.category).length > 0) {
      <lib-project-section
        [id]="section.category"
        [title]="section.titleKey | translate"
        [projects]="getProjects(section.category)"
      />
    }
  }
</div>
