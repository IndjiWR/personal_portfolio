<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="CasaMatch">
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b16"/>
      <stop offset="1" stop-color="#1a1a35"/>
    </linearGradient>
    <linearGradient id="cm-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#ff6b9d"/>
    </linearGradient>
    <pattern id="cm-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="cm-glow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#cm-bg)"/>
  <rect width="600" height="340" fill="url(#cm-grid)"/>
  <!-- aurora blobs -->
  <circle cx="120" cy="90" r="80" fill="url(#cm-accent)" opacity="0.4" filter="url(#cm-glow)"/>
  <circle cx="480" cy="250" r="100" fill="#7df9ff" opacity="0.2" filter="url(#cm-glow)"/>
  <!-- swipe card stack -->
  <g transform="translate(200,80) rotate(-8)">
    <rect width="180" height="180" rx="16" fill="#13132a" stroke="#22223a" stroke-width="1"/>
  </g>
  <g transform="translate(215,75) rotate(-3)">
    <rect width="180" height="180" rx="16" fill="#1a1a35" stroke="#333355" stroke-width="1"/>
  </g>
  <g transform="translate(230,70)">
    <rect width="180" height="180" rx="16" fill="#0b0b16" stroke="#ff8c42" stroke-width="1.5"/>
    <rect x="16" y="16" width="148" height="100" rx="8" fill="#22223a"/>
    <circle cx="40" cy="44" r="6" fill="#ff8c42"/>
    <rect x="56" y="38" width="70" height="4" rx="2" fill="#6b7a99"/>
    <rect x="56" y="48" width="50" height="4" rx="2" fill="#333355"/>
    <rect x="16" y="130" width="80" height="4" rx="2" fill="#e8e4d9"/>
    <rect x="16" y="142" width="120" height="4" rx="2" fill="#6b7a99"/>
    <rect x="16" y="152" width="100" height="4" rx="2" fill="#6b7a99"/>
    <!-- heart icon -->
    <g transform="translate(140,140)">
      <path d="M12 21s-8-5-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-8 11-8 11z" fill="#ff8c42"/>
    </g>
  </g>
  <!-- title -->
  <text x="30" y="305" fill="#e8e4d9" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600">CasaMatch</text>
  <text x="30" y="322" fill="#6b7a99" font-family="'JetBrains Mono', monospace" font-size="11">// swipe · match · move in</text>
</svg>
